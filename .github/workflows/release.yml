name: Publish watcher release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
concurrency:
  group: watcher-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run check
      - run: npm test
      - name: Build with the updater's Docker builder
        run: DOCKER_BUILDKIT=0 docker build --tag valheim-watcher:test watcher
      - name: Verify version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'if (process.env.RELEASE_TAG !== "v" + require("./package.json").version) process.exit(1)'
      - run: npm run package:release
      - name: Publish versioned package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          dist/valheim-watcher.zip dist/valheim-watcher.zip.sha256
          --verify-tag --title "Watcher $RELEASE_TAG"
          --notes "Stable watcher release. Includes runtime source and SHA-256 checksums; excludes configuration and game data."
